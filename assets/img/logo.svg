<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="currentColor">
  <!-- Triangolo esterno -->
  <path d="M 250 30 L 470 460 L 30 460 Z" fill="none" stroke="currentColor" stroke-width="38" stroke-linejoin="round"/>
  <!-- Curva alla base -->
  <path d="M 60 460 Q 250 510 440 460" fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round"/>
  <!-- A interna (vertice alto) -->
  <path d="M 250 130 L 215 215 L 285 215 Z" fill="currentColor"/>
  <!-- O centrale -->
  <circle cx="175" cy="290" r="58" fill="none" stroke="currentColor" stroke-width="22"/>
  <!-- E laterale (3 segmenti orizzontali a destra) -->
  <g fill="currentColor">
    <rect x="280" y="225" width="100" height="22" rx="2"/>
    <rect x="280" y="280" width="80" height="22" rx="2"/>
    <rect x="280" y="335" width="100" height="22" rx="2"/>
  </g>
</svg>
